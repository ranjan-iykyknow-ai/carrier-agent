[project]
name = "carrier-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "celery[redis]>=5.6.3",
    "deepgram-sdk>=7.7.0",
    "django~=5.2.0",
    "django-environ>=0.14.0",
    "django-htmx>=1.29.0",
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.1.0",
    "langfuse>=4,<5",
    "openai>=3.3.1",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs (OpenAI, Deepgram, Langfuse); run explicitly with -m live",
]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
target-version = "py312"
# Django migrations are generated code
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "DJ"]
# DJ001 (no null=True on char fields) conflicts with the spec's "NULL means unknown"
# convention for imported values that must stay distinct from empty strings.
ignore = ["DJ001"]
