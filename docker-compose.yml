services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: goodlane
      POSTGRES_PASSWORD: goodlane
      POSTGRES_DB: carrier_agent
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goodlane -d carrier_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
